<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Rudy Zigzag Lab — cấu trúc SMC</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e; --accent:#2157f3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial; background:var(--bg); color:var(--txt);
         display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:0 0 auto; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  .ctl { display:flex; gap:6px; align-items:center; font-size:13px; flex-wrap:wrap; }
  select, input, button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.warn { background:#9e1b1b; border-color:#9e1b1b; }
  #chart { flex:1 1 auto; min-height:220px; touch-action:none; position:relative; }
  .hint { font-size:12px; color:var(--mut); padding:6px 12px; border-top:1px solid var(--line); flex:0 0 auto; }
  .legend { display:inline-flex; gap:4px; align-items:center; margin-right:12px; }
  .sw { width:16px; height:3px; display:inline-block; border-radius:2px; }
  @media (max-width:720px){ header h1 { width:100%; margin:0 0 2px; font-size:14px; } select,input,button{ padding:8px 10px; font-size:14px; } }
</style>
</head>
<body>
<header>
  <h1>🎯 Rudy Zigzag Lab <span style="font-size:10px;color:#58a6ff;font-weight:400">build 2026-10-23·#60 (fix: đỉnh+đáy KHÔNG còn cùng 1 nến — cấm đảo trên cây vừa lập cực-trị)</span></h1>
  <div class="ctl">
    <select id="src" onchange="srcChange()">
      <option value="binance">Binance</option>
      <option value="sample">Mẫu</option>
    </select>
    <input id="sym" value="BTCUSDT" size="9" title="Symbol Binance">
    <select id="tf" onchange="loadBinance()" title="Khung thời gian">
      <option>1m</option><option>5m</option><option>15m</option><option>30m</option>
      <option selected>1h</option><option>4h</option><option>1d</option><option>1w</option>
    </select>
    <input id="lim" type="number" value="500" min="100" max="1000" size="4" title="Số nến">
    <button class="primary" onclick="loadBinance()">Tải</button>
  </div>
  <div class="ctl">
    <label>Độ nhạy swing:</label>
    <input id="dev" type="range" min="0.5" max="5" value="2" step="0.1" oninput="recalc()" title="Đảo swing khi giá HỒI ngược ≥ (số này)×ATR so với đỉnh/đáy hiện tại. Nhỏ=nhiều swing chi tiết · Lớn=ít swing lớn (thoáng). Ngưỡng theo ATR cục-bộ (scale-invariant) nên KHÔNG kẹt sau cú pump.">
    <span id="devV">2×ATR</span>
    <label style="margin-left:10px" title="Cấu trúc PHỚT LỜ cây nến spike: cap râu dài bất-thường theo ATR (chỉ khi tính zigzag; nến trên chart vẫn vẽ râu thật). Số bên cạnh = độ nhạy (×ATR), nhỏ=gắt."><input id="deSpike" type="checkbox" checked onchange="recalc()"> Lọc spike</label>
    <input id="spikeMult" type="range" min="2" max="6" step="0.5" value="3" oninput="recalc()" title="Ngưỡng ×ATR: râu vượt quá mức này bị cap" style="width:70px">
    <span id="spikeMultV" style="color:#8b949e">×3</span>
  </div>
  <div class="ctl">
    <label title="Hiện nhãn HH/HL/LH/LL"><input id="showHL" type="checkbox" checked onchange="drawOverlay();saveUI()"> HH/HL</label>
    <label title="Hiện nhãn BOS/CHoCH"><input id="showSMC" type="checkbox" checked onchange="drawOverlay();saveUI()"> BOS/CHoCH</label>
    <button class="warn" onclick="resetEdits()" title="Xoá mọi sửa tay (dời/thêm/gỡ pivot)">↺ Reset sửa tay</button>
    <button class="primary" onclick="sendToClaude()">📨 Gửi cho em</button>
    <span id="status" style="font-weight:600"></span>
  </div>
</header>

<div id="chart"></div>

<div class="hint">
  <span class="legend"><span class="sw" style="background:#3fb950"></span> sườn cấu-trúc lên</span>
  <span class="legend"><span class="sw" style="background:#f85149"></span> sườn cấu-trúc xuống</span>
  <span class="legend"><span class="sw" style="background:#5a6472"></span> sườn hồi (HL/LH)</span>
  <span class="legend" style="color:#58a6ff">BOS</span><span class="legend" style="color:#d2a8ff">CHoCH</span>
  — <b>Sửa tay</b>: <b>Chuột phải</b>=gỡ pivot · <b>Ctrl+kéo</b>=dời · <b>Shift+click</b>=thêm (trên=đỉnh, dưới=đáy).
</div>

<script>
/* ===================== LÕI ZIGZAG (chỉ 1 thuật toán đúng) ===================== */
// Gộp 2 swing cùng loại liên tiếp -> giữ cái cực hơn (ép so-le H/L/H/L).
function mergeAlt(zz){ const r=[]; for(const q of zz){ if(r.length && r[r.length-1].type===q.type){ const L=r[r.length-1]; if((q.type==='H'&&q.price>L.price)||(q.type==='L'&&q.price<L.price)) r[r.length-1]=q; } else r.push(q); } return r; }

// ZIGZAG = ATR-DEVIATION: đỉnh/đáy tạm dời theo giá; ĐẢO chiều khi giá HỒI ngược ≥ dev×ATR
// so với cực-trị hiện tại. Ngưỡng theo ATR CỤC-BỘ nên scale-invariant -> KHÔNG bao giờ KẸT
// sau cú pump (khác luật 'phá đáy cũ' làm kẹt cả đoạn sideways). dev nhỏ=nhiều swing chi tiết.
function swingChain(cs,dev){
  if(cs.length<3) return [];
  dev=dev||1.5; const a=atrSeries(cs,14); const out=[]; let dir=0;
  let hi={idx:0,p:cs[0].high}, lo={idx:0,p:cs[0].low};
  const push=s=>{ if(out.length && out[out.length-1].type===s.type){ const L=out[out.length-1];
      if((s.type==='H'&&s.price>=L.price)||(s.type==='L'&&s.price<=L.price)) out[out.length-1]=s; } else out.push(s); };
  for(let i=1;i<cs.length;i++){ const c=cs[i], thr=dev*a[i];
    if(c.high>hi.p) hi={idx:i,p:c.high};
    if(c.low<lo.p) lo={idx:i,p:c.low};
    // GUARD hi.idx<i / lo.idx<i: CẤM đảo ngay trên cây vừa lập cực-trị -> đỉnh & đáy KHÔNG BAO GIỜ cùng 1 nến
    if(dir>=0 && hi.idx<i && c.low < hi.p-thr){ push({idx:hi.idx,time:cs[hi.idx].time,price:hi.p,type:'H'}); dir=-1; lo={idx:i,p:c.low}; }
    else if(dir<=0 && lo.idx<i && c.high > lo.p+thr){ push({idx:lo.idx,time:cs[lo.idx].time,price:lo.p,type:'L'}); dir=1; hi={idx:i,p:c.high}; }
  }
  if(dir>0) push({idx:hi.idx,time:cs[hi.idx].time,price:hi.p,type:'H'}); else if(dir<0) push({idx:lo.idx,time:cs[lo.idx].time,price:lo.p,type:'L'});
  return mergeAlt(out);
}

// ATR rolling (true range trung bình n kỳ) — thước đo biên-độ CỤC-BỘ (cho zigzag + lọc spike).
function atrSeries(cs,n){ n=n||14; const tr=[],out=[]; for(let i=0;i<cs.length;i++){ const h=cs[i].high,l=cs[i].low,pc=i?cs[i-1].close:cs[i].open;
    tr.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc))); }
  let sum=0; for(let i=0;i<cs.length;i++){ sum+=tr[i]; if(i>=n) sum-=tr[i-n]; out[i]= i<2? tr[i] : sum/Math.min(i+1,n); } return out; }
// DE-SPIKE: cap phần RÂU vượt quá mult×ATR so với THÂN nến (chỉ cho việc tính zigzag).
// Râu bình-thường (<mult×ATR) giữ nguyên; râu spike bị cắt về mép-thân + mult×ATR. KHÔNG nhìn-trước (causal).
function deSpike(cs,mult){ const a=atrSeries(cs,14); return cs.map((c,i)=>{ const bodyHi=Math.max(c.open,c.close), bodyLo=Math.min(c.open,c.close), cap=mult*a[i];
    return { time:c.time, open:c.open, close:c.close,
      high: Math.min(c.high, bodyHi+cap),
      low:  Math.max(c.low,  bodyLo-cap) }; }); }

// BOS/CHoCH = khớp 4 swing cuối (declarative) + xác-nhận ĐÓNG-NẾN vượt level.
function labelBOSCHoCH(cs,sw){
  const ev=[];
  for(let i=3;i<sw.length;i++){
    const s4=sw[i-3],s3=sw[i-2],s2=sw[i-1],s1=sw[i], pat=s4.type+s3.type+s2.type+s1.type;
    const L4=s4.price,L3=s3.price,L2=s2.price,L1=s1.price; let type=null,dir=0;
    if(pat==='LHLH' && L4<L2&&L2<L3&&L3<L1){type='BOS';dir=1;}
    else if(pat==='HLHL' && L4>L2&&L2>L3&&L3>L1){type='BOS';dir=-1;}
    else if(pat==='LHLH' && L1>L3&&L3>L4&&L4>L2){type='CHoCH';dir=1;}
    else if(pat==='HLHL' && L1<L3&&L3<L4&&L4<L2){type='CHoCH';dir=-1;}
    if(!type) continue;
    const level=s3.price; let breakIdx=-1;
    for(let j=s2.idx+1;j<cs.length;j++){ if(dir>0? cs[j].close>level : cs[j].close<level){ breakIdx=j; break; } }
    if(breakIdx<0) continue;                       // chưa đóng-nến vượt -> CHƯA phá, không vẽ
    ev.push({pivotIdx:s3.idx, level, type, dir, breakIdx});
  }
  return ev;
}

/* ===================== STATE ===================== */
let chart, candleSeries, overlay, octx;
let candles=[], algoSwings=[], smcEv=[];
let removedSwings=[], movedSwings={}, addedSwings=[], swingDrag=null;

function idxAtTime(t){ let best=0,bd=Infinity; for(let i=0;i<candles.length;i++){ const d=Math.abs(candles[i].time-t); if(d<bd){bd=d;best=i;} } return best; }

/* ===================== CHART + SỬA TAY ===================== */
function initChart(){
  const el=document.getElementById('chart');
  chart=LightweightCharts.createChart(el,{
    autoSize:true,
    layout:{background:{color:'#0e1117'},textColor:'#e6edf3'},
    grid:{vertLines:{color:'#1c222b'},horzLines:{color:'#1c222b'}},
    timeScale:{timeVisible:true,secondsVisible:false,borderColor:'#30363d',rightOffset:4,minBarSpacing:0.2},
    rightPriceScale:{borderColor:'#30363d'},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true,axisDoubleClickReset:true},
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#089981',downColor:'#f23645',borderVisible:false,wickUpColor:'#089981',wickDownColor:'#f23645'});
  overlay=document.createElement('canvas');
  overlay.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:3;';
  el.appendChild(overlay); octx=overlay.getContext('2d');
  chart.timeScale().subscribeVisibleLogicalRangeChange(drawOverlay);
  if(window.ResizeObserver) new ResizeObserver(drawOverlay).observe(el);

  const lock=on=>chart.applyOptions({handleScroll:!on?{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false}:false, handleScale:!on});
  const say=(t,c)=>{ const s=document.getElementById('status'); s.style.color=c||'#8b949e'; s.textContent=t; };
  const nearestSwing=(mx,my)=>{ let best=null,bd=Infinity; for(const s of algoSwings){ const sx=chart.timeScale().timeToCoordinate(s.time), sy=candleSeries.priceToCoordinate(s.price); if(sx==null||sy==null)continue; const d=Math.hypot(sx-mx,sy-my); if(d<bd){bd=d;best=s;} } return {best,bd}; };
  const snapCandle=mx=>{ const t=chart.timeScale().coordinateToTime(mx); if(t==null) return null; let c=null,bd=Infinity; for(const k of candles){ const d=Math.abs(k.time-t); if(d<bd){bd=d;c=k;} } return c; };

  el.addEventListener('contextmenu',e=>{ e.preventDefault(); if(!algoSwings.length) return;
    const r=el.getBoundingClientRect(), {best,bd}=nearestSwing(e.clientX-r.left,e.clientY-r.top);
    if(best && bd<45){ removedSwings.push(best.time); recalc(); saveDrawings(); say('đã gỡ 1 pivot (↺ Reset để hoàn tác)'); } });
  el.addEventListener('mousedown',e=>{
    if(e.button!==0 || !algoSwings.length) return;
    const r=el.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    if(e.ctrlKey||e.metaKey){ const {best,bd}=nearestSwing(mx,my);
      if(best && bd<60){ swingDrag={orig:best.time}; lock(true); e.stopPropagation(); if(e.cancelable)e.preventDefault(); say('đang dời pivot… thả để chốt','#58a6ff'); } }
    else if(e.shiftKey){ const c=snapCandle(mx), pr=candleSeries.coordinateToPrice(my);
      if(c&&pr!=null){ const isH=pr>(c.high+c.low)/2; addedSwings.push({time:c.time,price:isH?c.high:c.low,type:isH?'H':'L'}); recalc(); saveDrawings(); say('đã thêm 1 '+(isH?'đỉnh':'đáy'),'#3fb950'); e.stopPropagation(); if(e.cancelable)e.preventDefault(); } }
  },true);
  window.addEventListener('mousemove',e=>{ if(!swingDrag) return; const r=el.getBoundingClientRect(); const c=snapCandle(e.clientX-r.left), pr=candleSeries.coordinateToPrice(e.clientY-r.top); if(!c||pr==null)return; movedSwings[swingDrag.orig]={time:c.time,price:pr}; recalc(); });
  window.addEventListener('mouseup',()=>{ if(swingDrag){ swingDrag=null; lock(false); saveDrawings(); say('đã dời pivot ✓','#3fb950'); } });
  window.addEventListener('orientationchange',()=>setTimeout(()=>{chart.timeScale().fitContent();drawOverlay();},300));
}

/* ===================== VẼ OVERLAY ===================== */
function drawOverlay(){
  if(!octx) return;
  const el=document.getElementById('chart'), w=el.clientWidth, h=el.clientHeight, dpr=window.devicePixelRatio||1;
  if(overlay.width!==Math.round(w*dpr)||overlay.height!==Math.round(h*dpr)){ overlay.width=Math.round(w*dpr); overlay.height=Math.round(h*dpr); overlay.style.width=w+'px'; overlay.style.height=h+'px'; }
  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,w,h);
  if(!candles.length || !algoSwings.length) return;
  const ts=chart.timeScale(), vr=ts.getVisibleRange(); if(!vr) return;
  const coord=s=>{ const y=candleSeries.priceToCoordinate(s.price); let x=ts.timeToCoordinate(s.time); return (y==null||x==null)?null:{x,y}; };

  // tag HH/HL/LH/LL
  const TAG=[]; { let lastH=null,lastL=null;
    for(let i=0;i<algoSwings.length;i++){ const s=algoSwings[i];
      if(s.type==='H'){ TAG[i]=lastH==null?'H':(s.price>lastH?'HH':'LH'); lastH=s.price; }
      else { TAG[i]=lastL==null?'L':(s.price<lastL?'LL':'HL'); lastL=s.price; } } }

  // các sườn: tới HH/LL = cấu-trúc (đậm xanh/đỏ) · tới HL/LH = hồi (mờ xám)
  octx.lineCap='round';
  for(let i=0;i+1<algoSwings.length;i++){ const a=coord(algoSwings[i]), b=coord(algoSwings[i+1]); if(!a||!b) continue;
    const t2=TAG[i+1], struct=(t2==='HH'||t2==='LL'||t2==='H'||t2==='L');
    if(struct){ octx.strokeStyle=(t2==='HH'||t2==='H')?'#3fb950':'#f85149'; octx.lineWidth=2.5; }
    else { octx.strokeStyle='#5a6472'; octx.lineWidth=1.3; }
    octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
  }
  octx.lineWidth=1; octx.lineCap='butt';

  // BOS/CHoCH
  if(document.getElementById('showSMC').checked){
    octx.textBaseline='middle'; octx.font='600 11px system-ui,Segoe UI,Arial';
    for(const e of smcEv){ const y=candleSeries.priceToCoordinate(e.level); if(y==null) continue;
      let x1=ts.timeToCoordinate(candles[e.pivotIdx].time); if(x1==null) x1=(candles[e.pivotIdx].time<=vr.from)?0:w;
      let x2=ts.timeToCoordinate(candles[e.breakIdx].time); if(x2==null) x2=(candles[e.breakIdx].time<=vr.from)?0:w;
      if(x2<x1){ const t=x1;x1=x2;x2=t; } if(x2-x1<2) continue;
      const col=e.type==='CHoCH'?'#d2a8ff':'#58a6ff', lbl=e.type, tw=octx.measureText(lbl).width, xMid=(x1+x2)/2;
      octx.strokeStyle=col; octx.lineWidth=1; octx.setLineDash([5,4]);
      if(x2-x1>tw+14){ const g=tw/2+5;
        octx.beginPath(); octx.moveTo(x1,y); octx.lineTo(xMid-g,y); octx.stroke();
        octx.beginPath(); octx.moveTo(xMid+g,y); octx.lineTo(x2,y); octx.stroke();
        octx.setLineDash([]); octx.fillStyle=col; octx.textAlign='center'; octx.fillText(lbl,xMid,y); }
      else { octx.beginPath(); octx.moveTo(x1,y); octx.lineTo(x2,y); octx.stroke();
        octx.setLineDash([]); octx.fillStyle=col; octx.textAlign='center'; octx.fillText(lbl,xMid,y-7); }
    }
  }

  // nhãn HH/HL/LH/LL
  if(document.getElementById('showHL').checked){
    octx.textBaseline='middle'; octx.font='700 11px system-ui,Segoe UI,Arial'; octx.textAlign='center';
    for(let i=0;i<algoSwings.length;i++){ const s=algoSwings[i], c=coord(s); if(!c) continue;
      octx.fillStyle=(TAG[i]==='HH'||TAG[i]==='HL')?'#3fb950':(TAG[i]==='LH'||TAG[i]==='LL')?'#f85149':'#c9d1d9';
      octx.fillText(TAG[i], c.x, s.type==='H'? c.y-11 : c.y+11); }
  }
}

/* ===================== RECALC ===================== */
function recalc(){
  if(!candles.length) return;
  let dev=parseFloat(document.getElementById('dev').value)||1.5; if(dev<0.1)dev=0.1;
  document.getElementById('devV').textContent=dev+'×ATR'+(dev<=1?' (chi tiết)':dev>=3?' (lớn)':'');
  const mult=parseFloat(document.getElementById('spikeMult').value)||3;
  document.getElementById('spikeMultV').textContent='×'+mult;
  const srcCs = document.getElementById('deSpike').checked ? deSpike(candles,mult) : candles;  // cấu trúc dùng nến đã cap-râu; chart vẫn vẽ nến thật
  algoSwings=swingChain(srcCs,dev);
  if(removedSwings.length) algoSwings=mergeAlt(algoSwings.filter(s=>!removedSwings.includes(s.time)));
  if(Object.keys(movedSwings).length || addedSwings.length){
    algoSwings=algoSwings.map(s=>{ const m=movedSwings[s.time]; return m?{...s,time:m.time,price:m.price,idx:idxAtTime(m.time)}:s; });
    for(const a of addedSwings) algoSwings.push({idx:idxAtTime(a.time),time:a.time,price:a.price,type:a.type});
    algoSwings.sort((x,y)=>x.time-y.time);
  }
  smcEv=labelBOSCHoCH(candles,algoSwings);
  drawOverlay(); saveUI();
}

/* ===================== DATA ===================== */
function srcChange(){ if(document.getElementById('src').value==='sample') loadSample(); else loadBinance(); }
async function loadBinance(){
  if(document.getElementById('src').value!=='binance') return;
  const sym=document.getElementById('sym').value.toUpperCase(), tf=document.getElementById('tf').value, lim=document.getElementById('lim').value;
  const st=document.getElementById('status'); st.style.color='#8b949e'; st.textContent='⏳ tải…';
  try{ const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=${lim}`);
    const d=await r.json(); if(!Array.isArray(d)) throw new Error(JSON.stringify(d).slice(0,80));
    candles=d.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
    applyData(); st.textContent='';
  }catch(e){ st.style.color='#f23645'; st.textContent='lỗi: '+e.message; }
}
function loadSample(){
  candles=[]; const t0=Math.floor(Date.now()/1000)-500*3600;
  for(let i=0;i<500;i++){ const base=100+20*Math.sin(i/40)+10*Math.sin(i/11)+(Math.sin(i*1.7)+Math.cos(i*2.3))*0.6;
    const o=base, cl=base+Math.sin(i*0.9)*0.8, hi=base+Math.abs(Math.sin(i*3.1))*1.5+0.5, lo=base-Math.abs(Math.cos(i*2.7))*1.5-0.5;
    candles.push({time:t0+i*3600,open:+o.toFixed(2),high:+Math.max(hi,o,cl).toFixed(2),low:+Math.min(lo,o,cl).toFixed(2),close:+cl.toFixed(2)}); }
  applyData();
}
function applyData(){
  if(!candles.length) return;
  candleSeries.setData(candles);
  restoreDrawings();
  recalc();
  chart.timeScale().fitContent();
}

/* ===================== SỬA TAY: lưu/khôi phục + reset ===================== */
function drawKey(){ return 'zzc:'+document.getElementById('sym').value.toUpperCase(); }
function saveUI(){ try{ localStorage.setItem('zzc:ui',JSON.stringify({sym:document.getElementById('sym').value,tf:document.getElementById('tf').value,dev:document.getElementById('dev').value,showHL:document.getElementById('showHL').checked,showSMC:document.getElementById('showSMC').checked,deSpike:document.getElementById('deSpike').checked,spikeMult:document.getElementById('spikeMult').value})); }catch(e){} }
function saveDrawings(){ try{ localStorage.setItem(drawKey(),JSON.stringify({removedSwings,movedSwings,addedSwings})); }catch(e){} saveUI(); }
function restoreDrawings(){ try{ const o=JSON.parse(localStorage.getItem(drawKey())||'{}'); removedSwings=o.removedSwings||[]; movedSwings=o.movedSwings||{}; addedSwings=o.addedSwings||[]; }catch(e){ removedSwings=[];movedSwings={};addedSwings=[]; } }
function resetEdits(){ removedSwings=[]; movedSwings={}; addedSwings=[]; saveDrawings(); recalc(); document.getElementById('status').textContent='đã xoá sửa tay'; }

/* ===================== GỬI CHO EM ===================== */
const RELAY='https://ntfy.sh/rudy-zigzag-lab-7h3k9x2';
function buildExport(){ return {
  symbol:document.getElementById('sym').value, tf:document.getElementById('tf').value, dev:parseFloat(document.getElementById('dev').value),
  nCandles:candles.length, timeRange:candles.length?[candles[0].time,candles[candles.length-1].time]:null,
  algoSwings:algoSwings.map(s=>({t:s.time,p:+s.price.toFixed(5),type:s.type})),
  smc:smcEv.map(e=>({type:e.type,dir:e.dir,level:+e.level.toFixed(5),breakT:candles[e.breakIdx].time})),
}; }
function sendToClaude(){
  if(!candles.length){ document.getElementById('status').textContent='⚠ chưa có data'; return; }
  const st=document.getElementById('status'); st.style.color='#f7b500'; st.textContent='⏳ gửi…';
  fetch(RELAY,{method:'POST',body:JSON.stringify(buildExport())})
    .then(r=>{ if(!r.ok)throw 0; st.style.color='#089981'; st.textContent='✓ Đã gửi! Nhắn Claude: "nhận chưa"'; })
    .catch(()=>{ st.style.color='#f23645'; st.textContent='✗ gửi lỗi'; });
}

/* ===================== BOOT ===================== */
initChart();
try{ const ui=JSON.parse(localStorage.getItem('zzc:ui')||'{}');
  if(ui.sym) document.getElementById('sym').value=ui.sym;
  if(ui.tf) document.getElementById('tf').value=ui.tf;
  if(ui.dev!=null){ document.getElementById('dev').value=ui.dev; document.getElementById('devV').textContent=ui.dev+'×ATR'; }
  if(ui.showHL!=null) document.getElementById('showHL').checked=ui.showHL;
  if(ui.showSMC!=null) document.getElementById('showSMC').checked=ui.showSMC;
  if(ui.deSpike!=null) document.getElementById('deSpike').checked=ui.deSpike;
  if(ui.spikeMult!=null){ document.getElementById('spikeMult').value=ui.spikeMult; document.getElementById('spikeMultV').textContent='×'+ui.spikeMult; }
}catch(e){}
loadBinance();
</script>
</body>
</html>
